<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>凍乾成本計算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --color-primary: #2563eb;
            --color-success: #16a34a;
            --color-danger: #dc2626;
            --color-bg-lighter: #f9fafb;
            --color-border: #d1d5db;
            --color-text-primary: #1f2937;
            --color-text-secondary: #6b7280;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%);
            min-height: 100vh;
            padding: 16px;
            color: var(--color-text-primary);
        }
        .container { max-width: 1024px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .header p { color: var(--color-text-secondary); font-size: 14px; }
        .tabs { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: 2px solid var(--color-border); border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; background: white; color: var(--color-text-primary); }
        .tab-btn.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
        .card { background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 24px; display: none; }
        .card.active { display: block; }
        .card h2 { font-size: 24px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px; border: 2px solid var(--color-border); border-radius: 8px; font-size: 16px; }
        input:focus, select:focus { outline: none; border-color: var(--color-primary); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--color-primary), #1d4ed8); color: white; }
        .btn-success { background: var(--color-success); color: white; }
        .btn-danger { background: var(--color-danger); color: white; padding: 8px 12px; width: auto; }
        .section-box { background: var(--color-bg-lighter); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
        .section-box h3 { font-weight: 600; margin-bottom: 12px; }
        .record-item { border: 2px solid var(--color-border); border-radius: 8px; padding: 16px; margin-bottom: 16px; background: var(--color-bg-lighter); }
        .stat-box { background: white; padding: 12px; border-radius: 6px; text-align: center; }
        .stat-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
        .stat-value { font-size: 16px; font-weight: 700; color: var(--color-primary); }
        .stat-box.green .stat-value { color: var(--color-success); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--color-text-secondary); }
        .edit-item { padding: 12px; border: 2px solid var(--color-border); border-radius: 8px; margin-bottom: 12px; background: white; }
        .edit-item input { margin: 0; padding: 10px; font-size: 16px; }
        .btn-small { padding: 8px 10px; font-size: 12px; min-width: 40px; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>凍乾成本計算器</h1>
            <p>快速計算每克成本及得率</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('calculator')">📊 成本計算</button>
            <button class="tab-btn" onclick="switchTab('history')">📋 歷史記錄</button>
            <button class="tab-btn" onclick="switchTab('analytics')">📈 統計分析</button>
            <button class="tab-btn" onclick="switchTab('settings')">⚙️ 設定管理</button>
        </div>

        <!-- 計算頁面 -->
        <div id="calculator" class="card active">
            <h2>計算新產品成本</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>原料選擇</label>
                    <select id="materialSelect"></select>
                </div>
                <div class="form-group">
                    <label>原料重量</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="number" id="weight" step="0.1" placeholder="輸入重量" style="flex: 1;">
                        <select id="weightUnit" style="width: 80px;">
                            <option value="kg">公斤</option>
                            <option value="jin">斤</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>產品形狀/尺寸</label>
                    <select id="shape">
                        <option value="">-- 請選擇 --</option>
                        <option value="原肉">原肉</option>
                        <option value="粒1.6cm">粒1.6cm</option>
                        <option value="粒1.0cm">粒1.0cm</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>成品淨重 (克)</label>
                    <input type="number" id="finishedWeight" step="10" placeholder="輸入成品淨重">
                </div>
            </div>
            <div class="section-box">
                <h3>選擇加工方法</h3>
                <div id="methodSelector"></div>
            </div>
            <button class="btn btn-primary" onclick="calculateCost()">➕ 計算成本並記錄</button>
        </div>

        <!-- 歷史記錄 -->
        <div id="history" class="card">
            <h2>計算歷史記錄</h2>
            <div id="recordsList"></div>
        </div>

        <!-- 統計分析 -->
        <div id="analytics" class="card">
            <h2>統計分析</h2>
            <div id="analyticsContent"></div>
        </div>

        <!-- 設定管理 -->
        <div id="settings" class="card">
            <div style="margin-bottom: 24px; padding: 16px; background: var(--color-bg-lighter); border-radius: 8px;">
                <h3 style="margin-bottom: 12px;">📥📤 數據備份與還原</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <button class="btn btn-primary" onclick="exportData()" style="font-size: 14px;">📥 導出備份</button>
                    <button class="btn btn-success" onclick="importData()" style="font-size: 14px;">📤 導入備份</button>
                </div>
            </div>
            <div style="margin-bottom: 24px;">
                <h2>原料管理</h2>
                <div class="section-box" style="margin-bottom: 16px;">
                    <h3>新增原料</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: flex-end;">
                        <input type="text" id="newMaterialName" placeholder="原料名稱">
                        <input type="number" id="newMaterialCost" placeholder="價格 ($/kg)">
                        <button class="btn btn-primary" style="width: 80px; font-size: 14px;" onclick="addMaterial()">新增</button>
                    </div>
                </div>
                <div id="materialsList"></div>
            </div>
            <div>
                <h2>加工方法管理</h2>
                <div class="section-box" style="margin-bottom: 16px;">
                    <h3>新增加工方法</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: flex-end;">
                        <input type="text" id="newMethodName" placeholder="加工方法名稱">
                        <input type="number" id="newMethodCost" placeholder="價格 ($/kg)">
                        <button class="btn btn-success" style="width: 80px; font-size: 14px;" onclick="addMethod()">新增</button>
                    </div>
                </div>
                <div id="methodsList"></div>
            </div>
        </div>
    </div>

    <script>
        let materials = [
            { id: 1, name: '牛肉泥', costPerKg: 96 },
            { id: 2, name: '雞里肌', costPerKg: 136.5 },
            { id: 3, name: '虱目魚柳', costPerKg: 217 },
            { id: 4, name: '雞胸清肉泥', costPerKg: 224 },
            { id: 5, name: '雞胸肉', costPerKg: 208 },
        ];

        let processMethods = [
            { id: 'freeze', name: '預凍塑型', costPerKg: 10 },
            { id: 'labor', name: '代工費', costPerKg: 110 },
            { id: 'cut_1_6', name: '切丁1.6cm', costPerKg: 40 },
            { id: 'cut_1_0', name: '切丁1.0cm', costPerKg: 50 },
            { id: 'beef_mix', name: '牛肉(混)', costPerKg: 16.67 },
            { id: 'pumpkin_mix', name: '南瓜(混)', costPerKg: 2.77 },
            { id: 'mulch', name: '打泥', costPerKg: 25 },
        ];

        let selectedMethods = processMethods.map(m => m.id);
        let records = [];

        function init() {
            loadFromLocalStorage();
            updateMaterialSelect();
            updateMethodSelector();
            updateMaterialsList();
            updateMethodsList();
            updateRecordsList();
        }

        function saveToLocalStorage() {
            const data = { materials, processMethods, records };
            localStorage.setItem('frozenDryCalcData', JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('frozenDryCalcData');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    materials = data.materials || materials;
                    processMethods = data.processMethods || processMethods;
                    records = data.records || records;
                    selectedMethods = processMethods.map(m => m.id);
                } catch (e) { }
            }
        }

        function exportData() {
            const data = { materials, processMethods, records, exportDate: new Date().toLocaleString('zh-TW') };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            alert('✅ 備份已下載！');
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.materials) materials = data.materials;
                        if (data.processMethods) processMethods = data.processMethods;
                        if (data.records) records = data.records;
                        selectedMethods = processMethods.map(m => m.id);
                        saveToLocalStorage();
                        updateMaterialSelect();
                        updateMethodSelector();
                        updateMaterialsList();
                        updateMethodsList();
                        updateRecordsList();
                        alert('✅ 數據已導入！');
                    } catch (error) {
                        alert('❌ 檔案格式錯誤');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function updateMaterialSelect() {
            const select = document.getElementById('materialSelect');
            select.innerHTML = '<option value="">-- 請選擇 --</option>';
            materials.forEach(m => {
                const option = document.createElement('option');
                option.value = m.id;
                option.textContent = `${m.name} ($${m.costPerKg}/kg)`;
                select.appendChild(option);
            });
        }

        function updateMethodSelector() {
            const selector = document.getElementById('methodSelector');
            selector.innerHTML = '';
            processMethods.forEach(method => {
                const label = document.createElement('label');
                label.style.cssText = 'display: flex; align-items: center; gap: 8px; padding: 8px; background: white; border: 2px solid var(--color-border); border-radius: 6px; margin-bottom: 8px; cursor: pointer;';
                label.innerHTML = `
                    <input type="checkbox" value="${method.id}" ${selectedMethods.includes(method.id) ? 'checked' : ''} onchange="toggleMethod('${method.id}')" style="width: 20px; height: 20px; cursor: pointer;">
                    <div style="flex: 1;">
                        <p style="font-weight: 600; margin: 0;">${method.name}</p>
                        <p style="font-size: 12px; color: var(--color-primary); margin: 0;">$${method.costPerKg}/kg</p>
                    </div>
                `;
                selector.appendChild(label);
            });
        }

        function toggleMethod(methodId) {
            const index = selectedMethods.indexOf(methodId);
            if (index > -1) selectedMethods.splice(index, 1);
            else selectedMethods.push(methodId);
        }

        function calculateCost() {
            const materialId = document.getElementById('materialSelect').value;
            const weight = parseFloat(document.getElementById('weight').value);
            const weightUnit = document.getElementById('weightUnit').value;
            const shape = document.getElementById('shape').value;
            const finishedWeight = parseFloat(document.getElementById('finishedWeight').value);

            if (!materialId || !weight || !shape || !finishedWeight) {
                alert('請填入所有欄位');
                return;
            }

            const weightInKg = weightUnit === 'jin' ? weight * 0.6 : weight;
            const material = materials.find(m => m.id == materialId);
            let totalCost = material.costPerKg * weightInKg;

            processMethods
                .filter(m => selectedMethods.includes(m.id))
                .forEach(method => {
                    totalCost += method.costPerKg * weightInKg;
                });

            const costPerGram = totalCost / finishedWeight;
            const yieldRate = (finishedWeight / (weightInKg * 1000)) * 100;

            const record = {
                id: Date.now(),
                materialName: material.name,
                rawWeight: weight,
                rawWeightUnit: weightUnit === 'jin' ? '斤' : 'kg',
                rawWeightInKg: weightInKg,
                finishedWeight: finishedWeight,
                shape: shape,
                totalCost: totalCost.toFixed(2),
                costPerGram: costPerGram.toFixed(2),
                yield: yieldRate.toFixed(2),
                date: new Date().toLocaleDateString('zh-TW'),
            };

            records.unshift(record);
            updateRecordsList();
            saveToLocalStorage();

            document.getElementById('weight').value = '';
            document.getElementById('shape').value = '';
            document.getElementById('finishedWeight').value = '';
            document.getElementById('materialSelect').value = '';

            alert(`成功記錄！每克成本: $${costPerGram.toFixed(2)}`);
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            updateRecordsList();
            saveToLocalStorage();
        }

        function updateRecordsList() {
            const list = document.getElementById('recordsList');
            updateAnalytics();
            if (records.length === 0) {
                list.innerHTML = '<div class="empty-state">尚無記錄</div>';
                return;
            }
            list.innerHTML = records.map(record => `
                <div class="record-item">
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--color-border);">
                        <div><div style="font-size: 12px; color: var(--color-text-secondary);">原料</div><div style="font-weight: 600;">${record.materialName}</div></div>
                        <div><div style="font-size: 12px; color: var(--color-text-secondary);">規格</div><div style="font-weight: 600;">${record.shape}</div></div>
                        <div><div style="font-size: 12px; color: var(--color-text-secondary);">日期</div><div style="font-weight: 600;">${record.date}</div></div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px;">
                        <div class="stat-box"><div class="stat-label">原料</div><div class="stat-value">${record.rawWeight} ${record.rawWeightUnit}</div></div>
                        <div class="stat-box green"><div class="stat-label">成品</div><div class="stat-value">${record.finishedWeight}g</div></div>
                        <div class="stat-box"><div class="stat-label">每克成本</div><div class="stat-value">$${record.costPerGram}</div></div>
                        <div class="stat-box"><div class="stat-label">得率</div><div class="stat-value">${record.yield}%</div></div>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 14px;">總成本: <strong>$${record.totalCost}</strong></span>
                        <button class="btn btn-danger" onclick="deleteRecord(${record.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function calculateAnalytics() {
            const productMap = {};
            records.forEach(record => {
                const productName = `${record.materialName}${record.shape ? ` ${record.shape}` : ''}`;
                if (!productMap[productName]) {
                    productMap[productName] = {
                        name: productName,
                        orders: [],
                        totalRawWeightKg: 0,
                        totalFinishedWeightG: 0,
                        totalCost: 0,
                    };
                }
                productMap[productName].orders.push(record);
                productMap[productName].totalRawWeightKg += record.rawWeightInKg;
                productMap[productName].totalFinishedWeightG += record.finishedWeight;
                productMap[productName].totalCost += parseFloat(record.totalCost);
            });

            Object.values(productMap).forEach(product => {
                product.orderCount = product.orders.length;
                product.averageFinishedWeight = (product.totalFinishedWeightG / product.orderCount).toFixed(0);
                product.averageCostPerGram = (product.totalCost / product.totalFinishedWeightG).toFixed(2);
            });

            return Object.values(productMap).sort((a, b) => b.orderCount - a.orderCount);
        }

        function updateAnalytics() {
            const analytics = calculateAnalytics();
            const container = document.getElementById('analyticsContent');
            if (analytics.length === 0) {
                container.innerHTML = '<div class="empty-state">還沒有記錄</div>';
                return;
            }
            container.innerHTML = `
                <div style="margin-bottom: 20px;"><h3>共 ${analytics.length} 個品項</h3></div>
                ${analytics.map((product, index) => `
                    <div style="border: 2px solid var(--color-border); border-radius: 8px; padding: 16px; margin-bottom: 12px; background: white;">
                        <h3 style="margin-bottom: 8px;">${product.name}</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; font-size: 13px;">
                            <div><span style="color: var(--color-text-secondary);">訂單數</span><br><strong>${product.orderCount} 次</strong></div>
                            <div><span style="color: var(--color-text-secondary);">總成品</span><br><strong>${product.totalFinishedWeightG} g</strong></div>
                            <div><span style="color: var(--color-text-secondary);">平均每克</span><br><strong>$${product.averageCostPerGram}</strong></div>
                        </div>
                    </div>
                `).join('')}
            `;
        }

        function addMaterial() {
            const name = document.getElementById('newMaterialName').value;
            const cost = parseFloat(document.getElementById('newMaterialCost').value);
            if (!name || !cost) { alert('請填入名稱和價格'); return; }
            const newId = Math.max(...materials.map(m => m.id), 0) + 1;
            materials.push({ id: newId, name, costPerKg: cost });
            document.getElementById('newMaterialName').value = '';
            document.getElementById('newMaterialCost').value = '';
            updateMaterialSelect();
            updateMaterialsList();
            saveToLocalStorage();
        }

        function addMethod() {
            const name = document.getElementById('newMethodName').value;
            const cost = parseFloat(document.getElementById('newMethodCost').value);
            if (!name || !cost) { alert('請填入名稱和價格'); return; }
            const newMethodId = `method_${Date.now()}`;
            processMethods.push({ id: newMethodId, name, costPerKg: cost });
            selectedMethods.push(newMethodId);
            document.getElementById('newMethodName').value = '';
            document.getElementById('newMethodCost').value = '';
            updateMethodSelector();
            updateMethodsList();
            saveToLocalStorage();
        }

        function updateMaterialsList() {
            const list = document.getElementById('materialsList');
            list.innerHTML = materials.map((m, index) => {
                const costPerJin = (m.costPerKg * 0.6).toFixed(2);
                return `
                <div class="edit-item">
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                        <input type="text" value="${m.name}" onchange="editMaterial(${m.id}, 'name', this.value)" style="flex: 1; min-width: 100px;">
                        <button class="btn btn-small" style="background: var(--color-primary); color: white;" ${index > 0 ? `onclick="moveMaterial(${m.id}, 'up')"` : 'disabled'}>⬆️</button>
                        <button class="btn btn-small" style="background: var(--color-primary); color: white;" ${index < materials.length - 1 ? `onclick="moveMaterial(${m.id}, 'down')"` : 'disabled'}>⬇️</button>
                        <button class="btn btn-danger btn-small" onclick="deleteMaterial(${m.id})">🗑️</button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                        <span>$</span>
                        <input type="number" value="${m.costPerKg}" onchange="editMaterial(${m.id}, 'costPerKg', this.value)" style="width: 70px;">
                        <span>/kg</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-text-secondary);">
                        <span>或</span>
                        <span>$</span>
                        <input type="number" value="${costPerJin}" onchange="editMaterial(${m.id}, 'costPerJin', this.value)" style="width: 70px;">
                        <span>/斤 (自動轉換)</span>
                    </div>
                </div>
            `}).join('');
        }

        function updateMethodsList() {
            const list = document.getElementById('methodsList');
            list.innerHTML = processMethods.map((m, index) => {
                const costPerJin = (m.costPerKg * 0.6).toFixed(2);
                return `
                <div class="edit-item">
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                        <input type="text" value="${m.name}" onchange="editMethod('${m.id}', 'name', this.value)" style="flex: 1; min-width: 100px;">
                        <button class="btn btn-small" style="background: var(--color-success); color: white;" ${index > 0 ? `onclick="moveMethod('${m.id}', 'up')"` : 'disabled'}>⬆️</button>
                        <button class="btn btn-small" style="background: var(--color-success); color: white;" ${index < processMethods.length - 1 ? `onclick="moveMethod('${m.id}', 'down')"` : 'disabled'}>⬇️</button>
                        <button class="btn btn-danger btn-small" onclick="deleteMethod('${m.id}')">🗑️</button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                        <span>$</span>
                        <input type="number" value="${m.costPerKg}" onchange="editMethod('${m.id}', 'costPerKg', this.value)" style="width: 70px;">
                        <span>/kg</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-text-secondary);">
                        <span>或</span>
                        <span>$</span>
                        <input type="number" value="${costPerJin}" onchange="editMethod('${m.id}', 'costPerJin', this.value)" style="width: 70px;">
                        <span>/斤 (自動轉換)</span>
                    </div>
                </div>
            `}).join('');
        }

        function editMaterial(id, field, value) {
            const m = materials.find(x => x.id === id);
            if (m) {
                if (field === 'name') m.name = value;
                else if (field === 'costPerKg') m.costPerKg = parseFloat(value);
                else if (field === 'costPerJin') m.costPerKg = parseFloat(value) / 0.6;
                updateMaterialSelect();
                updateMaterialsList();
                saveToLocalStorage();
            }
        }

        function editMethod(id, field, value) {
            const m = processMethods.find(x => x.id === id);
            if (m) {
                if (field === 'name') m.name = value;
                else if (field === 'costPerKg') m.costPerKg = parseFloat(value);
                else if (field === 'costPerJin') m.costPerKg = parseFloat(value) / 0.6;
                updateMethodSelector();
                updateMethodsList();
                saveToLocalStorage();
            }
        }

        function moveMaterial(id, direction) {
            const index = materials.findIndex(m => m.id === id);
            if (direction === 'up' && index > 0) {
                [materials[index], materials[index - 1]] = [materials[index - 1], materials[index]];
            } else if (direction === 'down' && index < materials.length - 1) {
                [materials[index], materials[index + 1]] = [materials[index + 1], materials[index]];
            }
            updateMaterialSelect();
            updateMaterialsList();
            saveToLocalStorage();
        }

        function moveMethod(id, direction) {
            const index = processMethods.findIndex(m => m.id === id);
            if (direction === 'up' && index > 0) {
                [processMethods[index], processMethods[index - 1]] = [processMethods[index - 1], processMethods[index]];
            } else if (direction === 'down' && index < processMethods.length - 1) {
                [processMethods[index], processMethods[index + 1]] = [processMethods[index + 1], processMethods[index]];
            }
            updateMethodSelector();
            updateMethodsList();
            saveToLocalStorage();
        }

        function deleteMaterial(id) {
            if (materials.length <= 1) { alert('至少要保留一個'); return; }
            materials = materials.filter(m => m.id !== id);
            updateMaterialSelect();
            updateMaterialsList();
            saveToLocalStorage();
        }

        function deleteMethod(id) {
            processMethods = processMethods.filter(m => m.id !== id);
            selectedMethods = selectedMethods.filter(mid => mid !== id);
            updateMethodSelector();
            updateMethodsList();
            saveToLocalStorage();
        }

        window.addEventListener('load', init);
    </script>
</body>
